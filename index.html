<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Whiskey Companion</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 1em;
      text-align: center;
    }
    video, canvas {
      width: 90%;
      max-width: 400px;
      margin: 1em auto;
      display: block;
      border-radius: 8px;
    }
    button {
      padding: 0.75em 1.5em;
      font-size: 1em;
      border: none;
      border-radius: 10px;
      margin: 0.5em;
      background: #f0f0f0;
    }
  </style>
</head>
<body>

<h1>Whiskey Companion</h1>

<video id="video" autoplay playsinline></video>
<canvas id="canvas" style="display:none;"></canvas>

<button onclick="startCamera()">Start Camera</button>
<button onclick="capturePhoto()">Take Photo</button>

<h2>My List</h2>
<div id="whiskeyList"></div>

<script>
  let video = document.getElementById('video');
  let canvas = document.getElementById('canvas');
  let context = canvas.getContext('2d');
  let db;

  async function startCamera() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'environment' },
        audio: false
      });
      video.srcObject = stream;
    } catch (e) {
      alert('Camera access denied or not available.');
    }
  }

  function capturePhoto() {
    canvas.style.display = 'block';
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    context.drawImage(video, 0, 0, canvas.width, canvas.height);
    identifyWhiskey();
  }

  async function identifyWhiskey() {
    const imageData = canvas.toDataURL('image/png');
    const prompt = `Identify this whiskey. Provide its name, general composition, and estimated price. Image: ${imageData}`;
    const apiKey = 'AIzaSyB6fX37O4pw8G2o-TWOn5nROIPRHjc07_c'; // User's actual API key

    try {
      const response = await fetch('https://gemini.googleapis.com/v1/generateContent', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${apiKey}`
        },
        body: JSON.stringify({
          model: "gemini-2.0-flash",
          contents: [
            `Identify this whiskey. Provide its name, general composition, and estimated price. Image:`,
            imageData
          ]
        })
      });

      const result = await response.json();
      const ocrResult = result.text.replace('```', '').replace('json\n', '');
      const data = JSON.parse(ocrResult);
      displayWhiskeyInfo(data);
    } catch (error) {
      alert('Error identifying whiskey: ' + error.message);
    }
  }

  function displayWhiskeyInfo(data) {
    const whiskeyList = document.getElementById('whiskeyList');
    const whiskeyInfo = document.createElement('div');
    whiskeyInfo.innerHTML = `
      <h3>${data.name || 'Unknown Whiskey'}</h3>
      <p>${data.description || 'No description available.'}</p>
      <p>Estimated Price: ${data.price || 'N/A'}</p>
      <button onclick="addToMyList('${data.name}', '${data.description}', '${data.price}')">Add to My List</button>
    `;
    whiskeyList.appendChild(whiskeyInfo);
  }

  function addToMyList(name, description, price) {
    const transaction = db.transaction(['whiskeys'], 'readwrite');
    const store = transaction.objectStore('whiskeys');
    const whiskey = { name, description, price, notes: '' };
    store.add(whiskey);

    displaySavedWhiskeys();
  }

  function displaySavedWhiskeys() {
    const transaction = db.transaction(['whiskeys'], 'readonly');
    const store = transaction.objectStore('whiskeys');
    const whiskeyList = document.getElementById('whiskeyList');
    whiskeyList.innerHTML = '';

    store.openCursor().onsuccess = function(event) {
      const cursor = event.target.result;
      if (cursor) {
        const whiskey = cursor.value;
        const listItem = document.createElement('div');
        listItem.innerHTML = `
          <h3>${whiskey.name}</h3>
          <p>${whiskey.description}</p>
          <p>Price: ${whiskey.price}</p>
          <textarea placeholder="Add your notes here..." onchange="updateNotes('${cursor.key}', this.value)">${whiskey.notes}</textarea>
        `;
        whiskeyList.appendChild(listItem);
        cursor.continue();
      }
    };
  }

  function updateNotes(key, notes) {
    const transaction = db.transaction(['whiskeys'], 'readwrite');
    const store = transaction.objectStore('whiskeys');
    store.get(key).onsuccess = function(event) {
      const whiskey = event.target.result;
      whiskey.notes = notes;
      store.put(whiskey);
    };
  }

  function initDatabase() {
    const request = indexedDB.open('WhiskeyDB', 1);

    request.onupgradeneeded = function(event) {
      db = event.target.result;
      const store = db.createObjectStore('whiskeys', { keyPath: 'id', autoIncrement: true });
      store.createIndex('name', 'name', { unique: false });
    };

    request.onsuccess = function(event) {
      db = event.target.result;
      displaySavedWhiskeys();
    };

    request.onerror = function(event) {
      alert('Database error: ' + event.target.errorCode);
    };
  }

  window.onload = initDatabase;
</script>

</body>
</html>
