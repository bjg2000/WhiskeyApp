<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Whiskey Companion</title>
  <style>
    body { font-family: sans-serif; text-align: center; margin: 20px; }
    video, canvas, img { max-width: 100%; border: 1px solid #ccc; margin-top: 10px; }
    #myList { margin-top: 20px; text-align: left; }
  </style>
</head>
<body>
  <h1>Whiskey Companion</h1>
  <video id="video" autoplay playsinline width="300" height="200"></video><br>
  <button id="captureBtn">Capture Photo</button><br>
  <canvas id="canvas" style="display: none;"></canvas>
  <img id="photo" alt="Captured photo" style="display:none;"><br>
  <button id="identifyBtn" style="display:none;">Identify Whiskey</button>

  <h2>My List</h2>
  <ul id="myList"></ul>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const photo = document.getElementById('photo');
    const captureBtn = document.getElementById('captureBtn');
    const identifyBtn = document.getElementById('identifyBtn');
    const myList = document.getElementById('myList');

    // Start camera
    navigator.mediaDevices.getUserMedia({ video: true })
      .then(stream => video.srcObject = stream)
      .catch(err => alert("Camera access error: " + err.message));

    captureBtn.onclick = () => {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      canvas.getContext('2d').drawImage(video, 0, 0);
      const dataUrl = canvas.toDataURL('image/png');
      photo.src = dataUrl;
      photo.style.display = 'block';
      identifyBtn.style.display = 'inline-block';
    };

    identifyBtn.onclick = () => {
      // For now, mock identification
      const whiskeyName = "Mock Whiskey " + Math.floor(Math.random() * 1000);
      const li = document.createElement('li');
      li.textContent = whiskeyName;
      myList.appendChild(li);
    };
  </script>
</body>
</html>
